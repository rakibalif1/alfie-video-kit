<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; font-family: "EB Garamond", "Cormorant Garamond", Georgia, serif; }
      #root { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
      .scene { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: hidden; background: #05070f; }
      .abs { position: absolute; }
      #caps { position: absolute; left: 0; top: 548px; width: 1280px; height: 118px; z-index: 100; pointer-events: none; }
      .cap { position: absolute; left: 110px; width: 1060px; bottom: 0; text-align: center; font-size: 40px; line-height: 1.18; color: #f1ece0; text-shadow: 0 2px 10px #000, 0 0 3px #000; letter-spacing: 0.4px; opacity: 0; }
      .cap.G { color: #bff6ff; font-style: italic; text-shadow: 0 0 18px #4fd1ff, 0 2px 8px #000; letter-spacing: 3px; }
      .cap.W { color: #ffd7a0; }
      #vig { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; z-index: 90; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.78) 100%); }
      #grain { position: absolute; left: -200px; top: -200px; width: 1700px; height: 1100px; z-index: 91; pointer-events: none; opacity: 0.16; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      #grade { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; z-index: 89; pointer-events: none; mix-blend-mode: screen; background: radial-gradient(ellipse at 50% 58%, rgba(80,108,170,0.26) 0%, rgba(26,38,78,0.16) 70%); }
      #scrim { position: absolute; left: 0; top: 520px; width: 1280px; height: 200px; z-index: 95; pointer-events: none; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.62)); }
      #barT, #barB { position: absolute; left: 0; width: 1280px; height: 34px; background: #000; z-index: 120; pointer-events: none; }
      #barT { top: 0; } #barB { bottom: 0; }
      #fade { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; z-index: 150; background: #000; opacity: 0; pointer-events: none; }
      .title { position: absolute; left: 0; width: 1280px; text-align: center; color: #e8efff; letter-spacing: 14px; text-shadow: 0 0 30px #5b7cff, 0 3px 10px #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1280" data-height="720">
{{SCENES}}
      <div id="grade"></div>
      <div id="vig"></div>
      <div id="grain"></div>
      <div id="scrim"></div>
      <div id="caps"></div>
      <div id="barT"></div><div id="barB"></div>
      <div id="fade"></div>
      <audio id="vo" src="assets/vo.wav" data-start="0" data-duration="{{DUR}}" data-track-index="5" data-volume="1"></audio>
      <audio id="amb" src="assets/ambience.wav" data-start="0" data-duration="{{DUR}}" data-track-index="6" data-volume="0.55"></audio>
    </div>
    <script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
