    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #ffe066; font-family: Arial, Helvetica, sans-serif; }
      #root { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: hidden; background: #ffe066; }

      .abs { position: absolute; }
      #caps { position: absolute; left: 0; top: 560px; width: 1280px; height: 130px; z-index: 100; pointer-events: none; }
      .cap { position: absolute; left: 90px; width: 1100px; bottom: 0; text-align: center; font: 900 40px/1.14 "Arial Black", Impact, Arial, sans-serif; color: #fff; -webkit-text-stroke: 8px #14101c; paint-order: stroke fill; text-shadow: 0 4px 0 #14101c; letter-spacing: 0.5px; opacity: 0; }

      #badge { position: absolute; left: 18px; top: 14px; z-index: 110; opacity: 0; display: flex; align-items: center; gap: 8px; background: #fff; border: 4px solid #14101c; border-radius: 40px; padding: 5px 16px 5px 8px; font: 800 17px Arial; color: #14101c; box-shadow: 4px 4px 0 #14101c; }
      #badge svg { width: 30px; height: 30px; }
      .chk { position: absolute; right: 18px; top: 14px; z-index: 110; opacity: 0; background: #14101c; color: #ffe066; border-radius: 12px; padding: 8px 16px; font: 800 20px Arial; max-width: 560px; box-shadow: 4px 4px 0 rgba(0,0,0,.35); }
      #fade { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; z-index: 150; background: #14101c; opacity: 0; pointer-events: none; }
    </style>
  </head>
