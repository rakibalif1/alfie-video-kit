<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#000;overflow:hidden">
<div style="position:relative;width:720px;height:1280px">
<canvas id="c" width="720" height="1280" style="width:720px;height:1280px;display:block"></canvas>
<div id="cap" style="position:absolute;left:30px;right:30px;bottom:150px;text-align:center;font:800 54px/1.15 Arial,Helvetica,sans-serif;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000"></div>
<div id="who" style="position:absolute;left:30px;top:40px;font:700 34px Arial;color:#1d3557;background:#ffffffcc;padding:8px 18px;border-radius:20px"></div>
</div>
<script type="importmap">
{"imports":{
"three":"/node_modules/three/build/three.module.js",
"three/addons/":"/node_modules/three/examples/jsm/",
"@pixiv/three-vrm":"/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
"@pixiv/three-vrm-core":"/node_modules/@pixiv/three-vrm-core/lib/three-vrm-core.module.js",
"@pixiv/three-vrm-materials-mtoon":"/node_modules/@pixiv/three-vrm-materials-mtoon/lib/three-vrm-materials-mtoon.module.js",
"@pixiv/three-vrm-materials-hdr-emissive-multiplier":"/node_modules/@pixiv/three-vrm-materials-hdr-emissive-multiplier/lib/three-vrm-materials-hdr-emissive-multiplier.module.js",
"@pixiv/three-vrm-materials-v0compat":"/node_modules/@pixiv/three-vrm-materials-v0compat/lib/three-vrm-materials-v0compat.module.js",
"@pixiv/three-vrm-node-constraint":"/node_modules/@pixiv/three-vrm-node-constraint/lib/three-vrm-node-constraint.module.js",
"@pixiv/three-vrm-springbone":"/node_modules/@pixiv/three-vrm-springbone/lib/three-vrm-springbone.module.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const EP = await (await fetch('/ep/episode.json')).json();
const TL = await (await fetch('/ep/tl.json')).json();
const W = 720, H = 1280, FPS = TL.fps;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), ease = (a) => a * a * (3 - 2 * a), lerp = (a, b, u) => a + (b - a) * u;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
const scene = new THREE.Scene();
const bg = new THREE.Color((EP.set && EP.set.sky) || 0xcfe3ff); scene.background = bg; scene.fog = new THREE.Fog(bg, 7, 15);
const floor = new THREE.Mesh(new THREE.CircleGeometry(5, 64), new THREE.MeshStandardMaterial({ color: (EP.set && EP.set.floor) || 0xfff1c9, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const skyline = (EP.set && EP.set.skyline) || [0xa8c7fa, 0x9fb8e8, 0xb9d3ff];
for (let i = 0; i < 7; i++) {
  const hh = 2.2 + (i % 3) * 0.6, b = new THREE.Mesh(new THREE.BoxGeometry(0.9, hh, 0.3), new THREE.MeshStandardMaterial({ color: skyline[i % skyline.length], roughness: 1 }));
  b.position.set(-3 + i, hh / 2, -3.2); scene.add(b);
}
const key = new THREE.DirectionalLight(0xffffff, Math.PI * 0.9); key.position.set(1.5, 2.5, 2.5); scene.add(key); scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 30);

// ---------- cast
const loader = new GLTFLoader(); loader.register((p) => new VRMLoaderPlugin(p));
const cast = {};
const slots = EP.layout || { N: { x: -0.45, yaw: 0.35, h: 1.6 }, A: { x: 0.42, yaw: -0.35, h: 1.5 } };
for (const [id, c] of Object.entries(EP.cast)) {
  const vrm = (await loader.loadAsync('/characters/' + c.model + '.vrm')).userData.vrm; VRMUtils.rotateVRM0(vrm); scene.add(vrm.scene);
  const flip = !!(vrm.meta && vrm.meta.metaVersion === '0'); vrm.update(0);
  const box = new THREE.Box3().setFromObject(vrm.scene), s = (slots[id] || { h: 1.55 }).h / (box.max.y - box.min.y);
  const slot = slots[id] || { x: 0, yaw: 0 };
  vrm.scene.scale.setScalar(s); vrm.scene.position.set(slot.x, -box.min.y * s, 0.3); vrm.scene.rotation.y += slot.yaw || 0;
  cast[id] = { vrm, flip, baseY: -box.min.y * s, name: c.name || id };
}
const bone = (c, n) => c.vrm.humanoid.getNormalizedBoneNode(n);
const q = (c, x, y, z) => new THREE.Quaternion().setFromEuler(new THREE.Euler(c.flip ? -x : x, y, c.flip ? -z : z));
// arm(down: 1 hangs, 0 overhead; fwd: swing forward; bend: elbow)
function arm(c, side, down, fwd, bend) {
  const s = side === 'L' ? 1 : -1, phi = s * (-1.3 + 2.6 * (1 - down));
  bone(c, side === 'L' ? 'leftUpperArm' : 'rightUpperArm').quaternion.copy(q(c, 0, -s * fwd, phi));
  bone(c, side === 'L' ? 'leftLowerArm' : 'rightLowerArm').quaternion.copy(q(c, 0, -s * bend, 0));
}
// gesture library: returns {L:[down,fwd,bend], R:[...], head:[x,y,z], spine:[x,y,z], face:{surprised,happy,sad,angry}, hop}
function gesture(name, t, tt, look) {
  const k = ease(clamp(tt / 0.35)), sw = Math.sin(t * 1.3) * 0.02;
  const g = { L: [1, 0.05, 0], R: [1, 0.05, 0], head: [0, 0, 0], spine: [sw, 0, 0], face: { happy: 0.15 }, hop: 0 };
  switch (name) {
    case 'listen': g.head = [0.04 + 0.03 * Math.sin(t * 2.4), look * 0.35, 0]; break;
    case 'explain': g.R = [1 - 0.3 * k, 0.6 * k + Math.sin(t * 3.2) * 0.2 * k, 1.0 * k]; g.head = [0.03, look * 0.2, 0]; g.face = { happy: 0.2 }; break;
    case 'panic': { const sh = Math.sin(t * 22) * 0.12 * k; g.L = [1 - 0.75 * k + sh, 0.55 * k, 0.9 * k]; g.R = [1 - 0.75 * k - sh, 0.55 * k, 0.9 * k]; g.head = [0, look * 0.3 + Math.sin(t * 14) * 0.18 * k, 0]; g.spine = [0.04 * k, Math.sin(t * 12) * 0.05 * k, 0]; g.face = { surprised: 0.9 * k }; break; }
    case 'point': g.R = [1 - 0.45 * k, 1.05 * k, 0.1]; g.head = [0.05, look * 0.35, 0]; g.face = { sad: 0.15 * k, happy: 0.05 }; break;
    case 'cheer': g.R = [1 - 0.85 * k + Math.sin(t * 16) * 0.05, 0.1 * k, 1.5 * k]; g.L = [1, 0.1, 0.2]; g.head = [-0.08, 0, 0]; g.face = { happy: 0.9 }; g.hop = Math.abs(Math.sin(tt * 7)) * 0.05 * k; break;
    case 'shrug': g.L = [1 - 0.22 * k, 0.35 * k, 1.2 * k]; g.R = [1 - 0.22 * k, 0.35 * k, 1.2 * k]; g.head = [0, 0, 0.12 * k]; g.face = { sad: 0.2 * k }; break;
    case 'wave': g.R = [1 - 0.8 * k, 0.1, 0.9 + Math.sin(t * 9) * 0.5 * k]; g.face = { happy: 0.8 }; break;
    case 'nod': g.head = [0.12 * Math.sin(t * 6), 0, 0]; g.face = { happy: 0.3 }; break;
    case 'angry': g.L = [1 - 0.3 * k, 0.2 * k, 1.1 * k]; g.R = [1 - 0.3 * k, 0.2 * k, 1.1 * k]; g.face = { angry: 0.8 * k }; g.head = [0.1, 0, 0]; break;
  }
  return g;
}

// ---------- props
const mats = { gold: new THREE.MeshStandardMaterial({ color: 0xe8b923, metalness: 0.6, roughness: 0.35 }) };
function poundTex() { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); g.fillStyle = '#f5c518'; g.fillRect(0, 0, 256, 256); g.strokeStyle = '#b8860b'; g.lineWidth = 14; g.beginPath(); g.arc(128, 128, 110, 0, 7); g.stroke(); g.fillStyle = '#8a6508'; g.font = 'bold 150px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText((EP.currency || '£'), 128, 138); return new THREE.CanvasTexture(c); }
const tex = poundTex();
const faceMats = [mats.gold, new THREE.MeshStandardMaterial({ map: tex }), new THREE.MeshStandardMaterial({ map: tex })];
const lineStart = (i) => (TL.lines[Math.min(i, TL.lines.length - 1)] || { start: 0 }).start;
const lineEnd = (i) => { const l = TL.lines[Math.min(i, TL.lines.length - 1)] || { start: 0, dur: 0 }; return l.start + l.dur; };
const props = (EP.props || []).map((p) => {
  const o = { cfg: p };
  if (p.type === 'coin') { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.08, 48), faceMats); m.rotation.x = Math.PI / 2; o.obj = new THREE.Group(); o.obj.add(m); o.obj.position.set(p.x ?? 0, p.y ?? 1.95, 0.25); scene.add(o.obj); }
  if (p.type === 'stack') { o.items = []; for (let i = 0; i < (p.count || 9); i++) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.07, 40), mats.gold); m.position.set(p.x ?? 0, 0.04 + i * 0.075, p.z ?? 1.0); m.visible = false; scene.add(m); o.items.push(m); } }
  if (p.type === 'bars') { o.items = [0, 1, 2].map((i) => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1, 0.22), new THREE.MeshStandardMaterial({ color: [0x57cc99, 0x80ed99, 0x38a3a5][i] })); m.position.set((p.x ?? 0) + (i - 1) * 0.3, 0.5, p.z ?? 1.2); scene.add(m); return m; }); }
  return o;
});
function updateProps(t) {
  for (const o of props) {
    const p = o.cfg, a = lineStart(p.fromLine ?? 0), b = lineEnd(p.toLine ?? p.fromLine ?? 0), u = ease(clamp((t - a) / Math.max(0.01, b - a)));
    if (p.type === 'coin') { const sc = lerp(p.scale ? p.scale[0] : 1, p.scale ? p.scale[1] : 0.4, u); o.obj.scale.setScalar(sc); o.obj.rotation.y = t * 1.2; o.obj.position.y = (p.y ?? 1.95) - 0.15 * u + Math.sin(t * 3) * 0.02; }
    if (p.type === 'stack') o.items.forEach((m, i) => { const k = clamp((t - a - i * 0.3) / 0.25); m.visible = k > 0; m.scale.setScalar(ease(k)); });
    if (p.type === 'bars') o.items.forEach((m, i) => { const h = Math.max(0.02, lerp((p.from || [0.3, 0.4, 0.5])[i], (p.to || [0.4, 0.8, 1.2])[i], u)); m.scale.y = h; m.position.y = h / 2; });
  }
}

// ---------- camera presets
const CAM = { wide: [0, 1.15, 6.2, 0, 0.95], mid: [0, 1.2, 5.5, 0, 1.0], closeN: [-0.25, 1.25, 3.4, -0.4, 1.2], closeA: [0.25, 1.2, 3.4, 0.4, 1.15], low: [0, 0.6, 5.0, 0, 1.0] };
const camOf = (name) => CAM[name] || CAM.wide;
const lines = EP.lines;
let sceneIdx = (t) => { let i = 0; for (let k = 0; k < TL.lines.length; k++) if (t >= TL.lines[k].start - 0.05) i = k; return i; };

window.renderAt = (t) => {
  const idx = sceneIdx(t), L = TL.lines[idx], inLine = L && t >= L.start - 0.05 && t <= L.start + L.dur + 0.15, cur = lines[idx] || {};
  for (const [id, c] of Object.entries(cast)) {
    const speaking = inLine && L.who === id, tt = speaking ? t - L.start : 0;
    const other = id === 'N' ? 1 : -1;
    const g = gesture(speaking ? (cur.gesture || 'explain') : (cur.react && cur.react[id]) || 'listen', t, speaking ? tt : Math.max(0, t - (L ? L.start : 0)), other);
    arm(c, 'L', ...g.L); arm(c, 'R', ...g.R);
    bone(c, 'head').quaternion.copy(q(c, ...g.head)); bone(c, 'spine').quaternion.copy(q(c, ...g.spine));
    c.vrm.scene.position.y = c.baseY + Math.sin(t * 2.2 + (id === 'A' ? 1 : 0)) * 0.01 + g.hop;
    const e = c.vrm.expressionManager, mv = speaking ? (TL.mouth[Math.min(TL.mouth.length - 1, Math.round(t * FPS))] || 0) : 0;
    e.setValue('aa', mv * 0.9); e.setValue('blink', Math.sin(t * 2.1 + (id === 'A' ? 2 : 0)) > 0.965 ? 1 : 0);
    for (const n of ['surprised', 'happy', 'sad', 'angry']) e.setValue(n, (g.face[n] || 0) * (n === 'happy' ? 0.5 : 1));
    c.vrm.update(1 / FPS);
  }
  updateProps(t);
  // camera: blend from the previous line's preset to this line's preset during the first 0.6 s
  const to = camOf(cur.cam), from = camOf(idx > 0 ? lines[idx - 1].cam : cur.cam), u = ease(clamp((t - (L ? L.start : 0)) / 0.6));
  const m = (i) => lerp(from[i], to[i], u);
  camera.position.set(m(0), m(1), m(2)); camera.lookAt(m(3), m(4) - 0.1, 0);
  document.getElementById('cap').textContent = inLine ? L.text : '';
  document.getElementById('who').textContent = inLine ? (cast[L.who] ? cast[L.who].name : L.who).toUpperCase() : '';
  renderer.render(scene, camera);
};
window.dur = TL.dur; window.fps = FPS; window.ready = true;
</script>
