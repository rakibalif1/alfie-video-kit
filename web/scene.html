<script type="module">

const GESTURES = {

  point: { clip: 'Interact', face: { happy: 0.1 } }, panic: { clip: 'Spell_Simple_Idle_Loop', face: { surprised: 0.9 } },
  cheer: { clip: 'Dance_Loop', face: { happy: 0.9 } }, shrug: { clip: 'Idle_Torch_Loop', face: { sad: 0.2 } },
  wave: { clip: 'Spell_Simple_Idle_Loop', face: { happy: 0.8 } }, nod: { clip: 'Idle_Talking_Loop', face: { happy: 0.3 } },
  angry: { clip: 'Interact', face: { angry: 0.8 } }, walk: { clip: 'Walk_Loop', face: {} }, sit: { clip: 'Sitting_Talking_Loop', face: {} },

// ---------- props (coin / stack / bars) as before
const mats = { gold: new THREE.MeshStandardMaterial({ color: 0xe8b923, metalness: 0.6, roughness: 0.35 }) };
function poundTex() { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); g.fillStyle = '#f5c518'; g.fillRect(0, 0, 256, 256); g.strokeStyle = '#b8860b'; g.lineWidth = 14; g.beginPath(); g.arc(128, 128, 110, 0, 7); g.stroke(); g.fillStyle = '#8a6508'; g.font = 'bold 150px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText((EP.currency || '£'), 128, 138); return new THREE.CanvasTexture(c); }

const lineStart = (i) => (TL.lines[Math.min(i, TL.lines.length - 1)] || { start: 0 }).start;
const lineEnd = (i) => { const l = TL.lines[Math.min(i, TL.lines.length - 1)] || { start: 0, dur: 0 }; return l.start + l.dur; };
const props = (EP.props || []).map((p) => {
  const o = { cfg: p };

  return o;
});

    const p = o.cfg, a = lineStart(p.fromLine ?? 0), b = lineEnd(p.toLine ?? p.fromLine ?? 0), u = ease(clamp((t - a) / Math.max(0.01, b - a)));
    const show = p.setName ? setOf[sceneIdx(t)] === p.setName : true;
